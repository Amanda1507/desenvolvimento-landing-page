<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>

    
    <div class="container">
        <ul class="nav">
          <li class="nav-item">
            <a class="nav-link" href="#">Acompanhe o Evento</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contato</a>
          </li>
        </ul>

        <div class="title">
            <h1>TRON: ARES 2</h1>
        </div>

        <div class="countdown">

            <div>
                <h1 id="dias"></h1>
                <p>Dias</p>
            </div>

            <div>
                <h1 id="horas"></h1>
                <p>Horas</p>
            </div>

            <div>
                <h1 id="minutos"></h1>
                <p>Minutos</p>
            </div>

            <div>
                <h1 id="segundos"></h1>
                <p>Segundos</p>
            </div>

        </div>

        <div class="button" id="btnCadastar">
            <p>Cadastre-se</p>
        </div>

    </div>
<!-- Um design moderno, criativo e alinhado ao tema do evento.

Banner principal com chamada de impacto para despertar o interesse dos visitantes.

Contador regressivo (cronômetro) para a data do evento (09/10/2026 às 12h00).

Exibição intuitiva e visualmente atrativa dos dias, horas, minutos e segundos restantes.

Elementos visuais que transmitam expectativa e urgência para participação no evento.

Layout totalmente responsivo para desktop, tablet e dispositivos móveis.

Botões de navegação para as demais páginas do site. -->




</body>
</html>
