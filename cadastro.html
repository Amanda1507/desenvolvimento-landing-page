    <main class="main-container">

        <section>

            <form action="recebe.php" method="POST" autocomplete="on">

                <div class="form">
                    <img class="icon" src="https://images.icon-icons.com/2483/PNG/512/user_icon_149851.png" alt="">
                    <input type="text" name="nome" placeholder="Nome Completo" id="nome" autocomplete="name">
                </div>

                <div class="form">
                    <img class="icon" src="https://uxwing.com/wp-content/themes/uxwing/download/communication-chat-call/email-envelope-line-white-icon.png" alt="">
                    <input type="email" name="email" placeholder="E-mail" id="email" autocomplete="email">
                </div>

                <div class="form">
                    <img class="icon" src="https://images.icon-icons.com/3446/PNG/512/security_protection_padlock_lock_icon_219213.png" alt="">
                    <input type="password" name="senha" placeholder="Senha" id="senha" required minlength="5" maxlength="15" autocomplete="new-password">
                </div>

                <div class="form">
                    <img class="icon" src="https://images.icon-icons.com/3446/PNG/512/security_protection_padlock_lock_icon_219213.png" alt="">
                    <input type="password" name="confirm_senha" placeholder="Confirme a senha" id="confirmSenha" required minlength="5" maxlength="15" autocomplete="off">
                </div>

                <div class="form-termos">
                    <input type="checkbox" name="termos" id="termos">
                    <label for="termos">
                        Li e concordo com os
                        <span class="uso">Termos de Uso</span>
                        e aceito receber informações sobre o lançamento
                    </label>
                </div>

                <button type="submit">CADASTRAR</button>

                <p class="ou">OU</p>

                <button type="button"><a class="google" href="https://accounts.google.com/v3/signin/identifier?hl=pt-BR&flowName=GlifWebSignIn&flowEntry=ServiceLogin&dsh=S1797821092:1789039596403219">ENTRAR COM O GOOGLE</a>
                </button>

            </form>

        </section>
